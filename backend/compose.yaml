services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ace_pro
      POSTGRES_USER: ace_pro
      POSTGRES_PASSWORD: ace_pro
    ports:
      - "5432:5432"
    volumes:
      - ace-pro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace_pro -d ace_pro"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ace-pro-local
      MINIO_ROOT_PASSWORD: ace-pro-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://127.0.0.1:8000,http://localhost:8000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ace-pro-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 ace-pro-local ace-pro-local-secret
        && mc mb --ignore-existing local/ace-pro-videos
        && mc anonymous set download local/ace-pro-videos
    restart: "no"

volumes:
  ace-pro-postgres:
  ace-pro-minio:

