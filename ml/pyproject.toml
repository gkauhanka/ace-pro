[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ace-pro-eval"
version = "0.1.0"
description = "Reproducible model adapters and evaluation tools for Ace Pro"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ace-eval = "ace_pro_eval.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ace_pro_eval"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
