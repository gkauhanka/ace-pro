name: AcePro
options:
  bundleIdPrefix: com.acepro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  AcePro:
    type: application
    platform: iOS
    sources:
      - AcePro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acepro.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AcePro/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Ace Pro
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  AcePro:
    build:
      targets:
        AcePro: all
    run:
      config: Debug
